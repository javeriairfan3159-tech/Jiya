<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kite Master — Store assets preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0a0612; color: #f4f0ff;
    }
    header {
      padding: 32px 24px 16px; text-align: center;
    }
    h1 { margin: 0; letter-spacing: .08em; }
    .sub { color: #00e5ff; margin-top: 8px; }
    section { padding: 12px 24px 36px; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 18px; color: #cbbbe8; letter-spacing: .12em; text-transform: uppercase; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    img, video { border-radius: 16px; max-width: 100%; background: #12081c; }
    .icon img { width: 180px; height: 180px; border-radius: 36px; }
    .shots img { width: 220px; }
    .banner img { width: 100%; }
    video { width: 100%; max-width: 720px; }
    .v9 { width: 280px !important; }
  </style>
</head>
<body>
  <header>
    <h1>KITE MASTER</h1>
    <p class="sub">Live wind · Pech tactics · Safety</p>
  </header>
  <section>
    <h2>Icons</h2>
    <div class="row icon">
      <img src="icon/kite-master-icon-512.png" alt="512 icon" />
      <img src="icon/kite-master-icon-1024.png" alt="1024 icon" />
      <img src="icon/kite-master-icon-alt-1024.png" alt="alt icon" />
    </div>
  </section>
  <section>
    <h2>Banners</h2>
    <div class="banner">
      <img src="banners/play-store-feature-1024x500.png" alt="Feature graphic" />
      <p></p>
      <img src="banners/promo-banner-1920x1080.png" alt="Promo banner" />
      <p></p>
      <img src="banners/youtube-thumbnail.png" alt="YouTube thumbnail" />
    </div>
  </section>
  <section>
    <h2>Store screenshots (real UI)</h2>
    <div class="row shots">
      <img src="screenshots/01-home-wind.png" alt="Home" />
      <img src="screenshots/02-conditions-alerts.png" alt="Conditions" />
      <img src="screenshots/03-masterclass-pech.png" alt="Masterclass" />
      <img src="screenshots/04-safety-knots.png" alt="Safety" />
      <img src="screenshots/05-achievements.png" alt="Achievements" />
    </div>
  </section>
  <section>
    <h2>Videos</h2>
    <div class="row">
      <video class="v9" controls src="videos/kite-master-promo-9x16.mp4"></video>
      <video controls src="videos/kite-master-promo-16x9.mp4"></video>
    </div>
  </section>
</body>
</html>
