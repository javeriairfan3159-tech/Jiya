<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charlie — Two Infinity And Beyond! · 5×7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #1a4fc4;
      --sky-deep: #0d2d7a;
      --banner-red: #e03131;
      --logo-yellow: #ffe14a;
      --hat: #6b3fa0;
      --paper: #fffef9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 5in;
      height: 7in;
      overflow: hidden;
      background: var(--paper);
    }

    body {
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--sky-deep);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page { size: 5in 7in; margin: 0; }

    .sheet {
      width: 5in;
      height: 7in;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 10%, #fff6d6 0%, transparent 28%),
        radial-gradient(circle at 85% 15%, #e8f0ff 0%, transparent 30%),
        radial-gradient(circle at 50% 90%, #ffe8f0 0%, transparent 35%),
        var(--paper);
      border: 4px solid var(--sky);
    }

    .confetti { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .confetti i {
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
    }
    .confetti i.w {
      width: 12px; height: 3px; border-radius: 3px;
    }

    .char {
      position: absolute;
      z-index: 2;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,0.15));
    }

    .c1 { top: 10px; left: 4px; width: 74px; }
    .c2 { top: 10px; right: 4px; width: 74px; }
    .c3 { top: 130px; left: 0; width: 68px; }
    .c4 { top: 120px; right: 0; width: 74px; }
    .c5 { top: 265px; left: -2px; width: 80px; }
    .c6 { top: 250px; right: -2px; width: 72px; }
    .c7 { bottom: 105px; left: 2px; width: 66px; }
    .c8 { bottom: 100px; right: 2px; width: 62px; }
    .c9 { bottom: 6px; right: 55px; width: 90px; }
    .c10 { top: 300px; left: 50%; margin-left: -26px; width: 48px; z-index: 5; }

    .content {
      position: relative;
      z-index: 4;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0.48in 0.62in 0.38in;
    }

    .banner-wrap {
      transform: rotate(-2.5deg);
      margin-top: 2px;
    }

    .banner {
      display: inline-block;
      background: var(--banner-red);
      color: var(--logo-yellow);
      font-family: "Luckiest Guy", "Fredoka", cursive;
      font-size: 30px;
      letter-spacing: 0.5px;
      line-height: 1;
      padding: 11px 20px 9px;
      border: 3px solid var(--sky);
      box-shadow: 5px 5px 0 rgba(13, 45, 122, 0.28);
      /* trapezoid feel */
      clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
      text-shadow:
        -2px -2px 0 #1240a8,
         2px -2px 0 #1240a8,
        -2px  2px 0 #1240a8,
         2px  2px 0 #1240a8,
         0  0 0 #1240a8;
    }

    .beyond {
      font-family: "Pacifico", cursive;
      font-size: 27px;
      color: var(--sky-deep);
      margin-top: 8px;
      transform: rotate(1deg);
    }

    .name {
      font-family: "Pacifico", cursive;
      font-size: 50px;
      color: var(--sky);
      line-height: 1;
      margin-top: 8px;
    }

    .turning-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
    }

    .turning-row .label {
      font-size: 18px;
      font-weight: 700;
      color: var(--sky);
    }

    .age {
      font-family: "Luckiest Guy", cursive;
      font-size: 68px;
      color: var(--logo-yellow);
      line-height: 0.85;
      transform: rotate(-5deg);
      text-shadow:
        -3px -3px 0 #1240a8,
         3px -3px 0 #1240a8,
        -3px  3px 0 #1240a8,
         3px  3px 0 #1240a8;
    }

    .join {
      margin-top: 64px;
      font-size: 15px;
      font-weight: 700;
      color: var(--sky-deep);
    }

    .when {
      margin-top: 12px;
      background: var(--banner-red);
      border: 2.5px dashed #fff;
      border-radius: 16px;
      padding: 10px 26px 9px;
      color: #fff;
      box-shadow: 0 0 0 7px var(--sky);
      min-width: 175px;
    }

    .when .date {
      font-family: "Luckiest Guy", cursive;
      font-size: 27px;
      color: var(--logo-yellow);
      letter-spacing: 1px;
      line-height: 1.05;
      text-shadow: 0 1px 0 rgba(0,0,0,0.15);
    }

    .when .time {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
    }

    .address {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--sky);
      line-height: 1.4;
      max-width: 230px;
    }

    .rsvp {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--sky-deep);
      letter-spacing: 0.3px;
    }
  </style>
</head>
