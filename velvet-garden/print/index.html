<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Velvet Garden — preview</title>
  <style>
    body { margin: 0; background: #f7dde4; color: #4a2432; font-family: Georgia, serif; }
    header { text-align: center; padding: 36px 16px 8px; letter-spacing: .42em; font-size: 12px; color: #c17a84; }
    h1 { font-weight: 400; letter-spacing: .08em; margin: 8px 0 28px; }
    .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 0 24px 48px; }
    figure { margin: 0; width: 280px; }
    img { width: 100%; height: auto; display: block; box-shadow: 0 18px 40px rgba(0,0,0,.18); }
    figcaption { text-align: center; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #c17a84; margin-top: 10px; }
  </style>
</head>
<body>
  <header>VELVET GARDEN</header>
  <h1 style="text-align:center">Birthday invitation suite</h1>
  <div class="grid">
    <figure><img src="../exports/blush.png" alt="Blush Atelier" /><figcaption>Blush Atelier</figcaption></figure>
    <figure><img src="../exports/blush-garden.png" alt="Blush Garden" /><figcaption>Blush Garden</figcaption></figure>
    <figure><img src="../exports/blush-blank.png" alt="Blush Blank" /><figcaption>Blush Blank</figcaption></figure>
    <figure><img src="../exports/nocturne.png" alt="Nocturne" /><figcaption>Nocturne</figcaption></figure>
    <figure><img src="../exports/forest.png" alt="Forest" /><figcaption>Forest</figcaption></figure>
    <figure><img src="../exports/ivory.png" alt="Ivory Atelier" /><figcaption>Ivory Atelier</figcaption></figure>
  </div>
</body>
</html>
