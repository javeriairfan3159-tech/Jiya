<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charlie Birthday Card · 5×7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1c4fbf;
      --blue-deep: #0c2f86;
      --red: #e22b2b;
      --yellow: #ffe34a;
      --hat: #6a3aa0;
      --paper: #fffdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 5in;
      height: 7in;
      overflow: hidden;
      background: var(--paper);
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--blue-deep);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page { size: 5in 7in; margin: 0; }

    .card {
      width: 5in;
      height: 7in;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -10%, #fff7d0 0%, transparent 42%),
        radial-gradient(ellipse at 100% 40%, #e7f0ff 0%, transparent 35%),
        radial-gradient(ellipse at 0% 70%, #ffe9f2 0%, transparent 32%),
        var(--paper);
      border: 5px solid var(--blue);
      box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 7px var(--yellow);
    }

    /* confetti layer */
    .bits { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .bits span {
      position: absolute;
      border-radius: 50%;
    }
    .bits .sq {
      border-radius: 2px;
      width: 10px;
      height: 4px;
    }

    .toy {
      position: absolute;
      z-index: 2;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,.14));
    }

    /* character placement — frame the card */
    .t-cowboy   { top: 8px; left: 2px; width: 82px; }
    .t-cowgirl  { top: 8px; right: 2px; width: 82px; }
    .t-ranger   { top: 125px; left: -2px; width: 76px; }
    .t-dino     { top: 118px; right: -4px; width: 84px; }
    .t-spring   { top: 255px; left: -6px; width: 88px; }
    .t-piggy    { top: 245px; right: -4px; width: 78px; }
    .t-alien    { bottom: 95px; left: 0; width: 72px; }
    .t-potato   { bottom: 92px; right: 0; width: 68px; }
    .t-horse    { bottom: 4px; left: 50%; margin-left: 18px; width: 96px; }
    .t-fork     { top: 305px; left: 50%; margin-left: -24px; width: 48px; z-index: 5; }

    .copy {
      position: relative;
      z-index: 4;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0.42in 0.68in 0.35in;
    }

    .logo-banner {
      margin-top: 4px;
      transform: rotate(-2.5deg);
      background: var(--red);
      color: var(--yellow);
      font-family: "Luckiest Guy", cursive;
      font-size: 29px;
      letter-spacing: 0.5px;
      line-height: 1;
      padding: 11px 22px 9px;
      border: 3px solid var(--blue);
      clip-path: polygon(3% 0%, 97% 0%, 100% 100%, 0% 100%);
      text-shadow:
        -2px -2px 0 #123ea8,
         2px -2px 0 #123ea8,
        -2px  2px 0 #123ea8,
         2px  2px 0 #123ea8;
      box-shadow: 5px 5px 0 rgba(12, 47, 134, 0.28);
    }

    .tagline {
      font-family: "Pacifico", cursive;
      font-size: 26px;
      color: var(--blue-deep);
      margin-top: 8px;
      transform: rotate(1deg);
    }

    .who {
      font-family: "Pacifico", cursive;
      font-size: 52px;
      color: var(--blue);
      line-height: 1;
      margin-top: 10px;
    }

    .age-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }
    .age-line .is {
      font-size: 18px;
      font-weight: 700;
      color: var(--blue);
    }
    .age-line .n {
      font-family: "Luckiest Guy", cursive;
      font-size: 70px;
      color: var(--yellow);
      line-height: 0.85;
      transform: rotate(-5deg);
      text-shadow:
        -3px -3px 0 #123ea8,
         3px -3px 0 #123ea8,
        -3px  3px 0 #123ea8,
         3px  3px 0 #123ea8;
    }

    .invite-line {
      margin-top: 62px;
      font-size: 15px;
      font-weight: 700;
      color: var(--blue-deep);
    }

    .when-box {
      margin-top: 12px;
      min-width: 180px;
      background: var(--red);
      color: #fff;
      border: 2.5px dashed #fff;
      border-radius: 16px;
      padding: 10px 24px 9px;
      box-shadow: 0 0 0 7px var(--blue);
    }
    .when-box .d {
      font-family: "Luckiest Guy", cursive;
      font-size: 27px;
      color: var(--yellow);
      letter-spacing: 1px;
      line-height: 1.05;
    }
    .when-box .t {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
    }

    .where {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--blue);
      line-height: 1.4;
      max-width: 230px;
    }

    .rsvp {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--blue-deep);
      letter-spacing: 0.3px;
    }
  </style>
</head>
