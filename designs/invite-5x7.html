<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moo Moos & Margaritas — 5×7 Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600&family=Pinyon+Script&family=Rye&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1500px;
      height: 2100px;
      overflow: hidden;
      background: #fff8f0;
    }
    .sheet {
      width: 1500px;
      height: 2100px;
      background-color: #fffdf8;
      background-image: url("../assets/cow-classic.svg");
      background-size: 132px 104px;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .mat {
      margin: 42px;
      flex: 1;
      background: #fff8f0;
      display: flex;
    }
    .frame {
      margin: 18px;
      flex: 1;
      border: 1.5px solid #e23d86;
      display: flex;
    }
    .pad {
      flex: 1;
      padding: 48px 72px 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    .kicker {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.42em;
      color: #b81d5a;
      text-transform: uppercase;
    }
    h1 {
      font-family: "Rye", serif;
      font-weight: 400;
      font-size: 92px;
      line-height: 0.92;
      color: #1c1410;
      margin-top: 18px;
    }
    .amp {
      font-family: "Pinyon Script", cursive;
      font-size: 36px;
      color: #c4a35a;
      line-height: 1;
      margin: 2px 0 0;
    }
    h2 {
      font-family: "Pinyon Script", cursive;
      font-size: 108px;
      line-height: 0.78;
      color: #e23d86;
      margin-top: -2px;
    }
    .flourish {
      width: 420px;
      height: 72px;
      object-fit: contain;
      margin-top: 10px;
    }
    .hero {
      width: 680px;
      height: 560px;
      object-fit: contain;
      object-position: center 42%;
    }
    .celebrate {
      font-family: "Cinzel", serif;
      font-size: 15px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #8a7464;
    }
    .name {
      font-family: "Pinyon Script", cursive;
      font-size: 78px;
      color: #1c1410;
      line-height: 0.9;
      margin: 6px 0 16px;
    }
    .pill {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.34em;
      color: #fff8f0;
      background: #e23d86;
      border-radius: 999px;
      padding: 12px 34px;
    }
    .when {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.16em;
      color: #1c1410;
      text-transform: uppercase;
    }
    .where {
      font-family: "Outfit", sans-serif;
      font-weight: 500;
      font-size: 22px;
      line-height: 1.45;
      color: #3a2f28;
      margin-top: 10px;
    }
    .where strong {
      display: block;
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.18em;
      margin-bottom: 4px;
    }
    .hairline {
      width: 160px;
      height: 1px;
      background: #c4a35a;
      margin: 0 auto 16px;
    }
    .dress {
      font-family: "Outfit", sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #1c1410;
    }
    .rsvp {
      font-family: "Cinzel", serif;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: #8a7464;
      text-transform: uppercase;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="mat">
      <div class="frame">
        <div class="pad">
          <div class="block">
            <p class="kicker">You’re invited</p>
            <h1>MOO MOOS</h1>
            <p class="amp">&amp;</p>
            <h2>Margaritas</h2>
            <img class="flourish" src="../assets/flourish.png" alt="" />
          </div>

          <img class="hero" src="../assets/hero-margarita.png" alt="Pink margarita with a cowboy hat" />

          <div class="block">
            <p class="celebrate">to celebrate</p>
            <p class="name">Isabella’s</p>
            <p class="pill">30TH BIRTHDAY</p>
          </div>

          <div class="block">
            <p class="when">Saturday, August 23 · 6:00 PM</p>
            <p class="where"><strong>The Ranch House</strong>123 Cowgirl Way, Austin, TX</p>
          </div>

          <div class="block">
            <div class="hairline"></div>
            <p class="dress">Boots on · Hats off · Cheers up</p>
            <p class="rsvp">RSVP to the host · Cowgirl cocktail attire</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
