<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blush &amp; Sky — Diaper Raffle</title>
  <link rel="stylesheet" href="_tokens.css" />
  <script src="wait.js"></script>
  <style>
    html, body { width: 1500px; height: 900px; overflow: hidden; background: var(--ivory); }
    .sheet { width: 1500px; height: 900px; position: relative; background: var(--paper); }
    .wash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; inset: 36px; border: 2px solid var(--gold); z-index: 4; pointer-events: none; }
    .frame::after { content: ""; position: absolute; inset: 10px; border: 1px solid var(--champagne); }
    .copy {
      position: absolute; inset: 56px 70px; z-index: 6;
      display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 20px; align-items: center;
    }
    .booties { width: 100%; height: 520px; object-fit: contain; }
    .text { text-align: center; }
    .kicker {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 16px;
      letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-deep); padding-left: 0.4em;
    }
    .title { font-family: "Great Vibes", cursive; font-size: 86px; color: var(--blush-deep); line-height: 0.85; margin: 4px 0 12px; }
    .body { font-family: "Cormorant Garamond", serif; font-size: 28px; color: var(--ink); line-height: 1.35; }
    .fields { margin-top: 22px; text-align: left; padding: 0 40px; }
    .row {
      display: flex; align-items: baseline; gap: 12px;
      font-family: "Cinzel", serif; font-size: 16px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-soft); margin: 10px 0;
    }
    .line { flex: 1; border-bottom: 1px solid var(--champagne); height: 1px; }
  </style>
</head>
<body>
  <div class="sheet">
    <img class="wash" src="../assets/paper-wash.png" alt="" />
    <div class="frame"></div>
    <div class="copy">
      <img class="booties" src="../assets/booties.png" alt="" />
      <div class="text">
        <p class="kicker">Bring a pack, take a chance</p>
        <p class="title">Diaper Raffle</p>
        <p class="body">Drop this ticket with a pack of diapers<br />for a chance to win a little extra something.</p>
        <div class="fields">
          <p class="row">Name <span class="line"></span></p>
          <p class="row">Guess <span class="line"></span></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
