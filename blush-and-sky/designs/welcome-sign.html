<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blush &amp; Sky — Welcome Sign</title>
  <link rel="stylesheet" href="_tokens.css" />
  <script src="wait.js"></script>
  <style>
    html, body { width: 1800px; height: 2400px; overflow: hidden; background: var(--ivory); }
    .sheet { width: 1800px; height: 2400px; position: relative; background: var(--paper); }
    .wash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .flora {
      position: absolute; top: 0; height: 100%;
      pointer-events: none; z-index: 2; width: 620px; object-fit: cover;
    }
    .flora.left { left: -10px; object-position: left center; }
    .flora.right { right: -10px; object-position: right center; }
    .frame { position: absolute; inset: 64px; border: 2.5px solid var(--gold); z-index: 4; pointer-events: none; opacity: 0.85; }
    .frame::after { content: ""; position: absolute; inset: 14px; border: 1.5px solid var(--champagne); }
    .copy {
      position: absolute; inset: 110px 240px 100px; z-index: 6;
      display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; text-align: center;
    }
    .kicker {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 24px;
      letter-spacing: 0.48em; text-transform: uppercase; color: var(--gold-deep); padding-left: 0.48em;
    }
    .question {
      font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 72px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); line-height: 1.05;
    }
    .script { font-family: "Great Vibes", cursive; font-size: 140px; color: var(--blush-deep); line-height: 0.8; }
    .script.sky { color: var(--sky-deep); }
    .balloons { width: 680px; height: 620px; object-fit: contain; }
    .baby {
      font-family: "Cinzel", serif; font-weight: 600; font-size: 36px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink); padding-left: 0.28em;
    }
    .foot {
      font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 36px; color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div class="sheet">
    <img class="wash" src="../assets/paper-wash.png" alt="" />
    <img class="flora left" src="../assets/botanical-left.png" alt="" />
    <img class="flora right" src="../assets/botanical-right.png" alt="" />
    <div class="frame"></div>
    <div class="copy">
      <p class="kicker">Welcome, friends</p>
      <p class="question">What will</p>
      <p class="script">baby be?</p>
      <img class="balloons" src="../assets/balloons-hero.png" alt="" />
      <p class="baby">The Walker Baby</p>
      <p class="foot">Please sign our guestbook · then take a guess</p>
    </div>
  </div>
</body>
</html>
