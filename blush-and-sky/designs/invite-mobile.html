<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blush &amp; Sky — Mobile Evite</title>
  <link rel="stylesheet" href="_tokens.css" />
  <script src="wait.js"></script>
  <style>
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
    .sheet { width: 1080px; height: 1920px; position: relative; background: var(--paper); }
    .wash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .flora {
      position: absolute; top: 0; height: 100%;
      pointer-events: none; z-index: 2;
    }
    .flora.left { left: -40px; width: 380px; object-fit: cover; object-position: left center; }
    .flora.right { right: -40px; width: 380px; object-fit: cover; object-position: right center; }
    .frame {
      position: absolute; inset: 40px;
      border: 2px solid var(--gold); z-index: 4; pointer-events: none; opacity: 0.85;
    }
    .frame::after { content: ""; position: absolute; inset: 10px; border: 1px solid var(--champagne); }
    .copy {
      position: absolute; inset: 64px 120px 56px; z-index: 6;
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; text-align: center;
    }
    .kicker {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 16px;
      letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-deep);
      padding-left: 0.4em; margin-top: 12px;
    }
    .rule { width: 80px; border-top: 1.5px solid var(--gold); margin: 10px auto 0; }
    .he-she { display: flex; align-items: baseline; gap: 16px; justify-content: center; }
    .he, .she { font-family: "Great Vibes", cursive; font-size: 92px; line-height: 0.8; }
    .he { color: var(--sky-deep); }
    .she { color: var(--blush-deep); }
    .or-col { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-bottom: 6px; }
    .diamond { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
    .or {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 14px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold-deep); padding-left: 0.28em;
    }
    .balloons {
      width: 400px; height: 380px; object-fit: contain; object-position: center 48%;
      margin: -4px 0 -6px;
    }
    .join {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 16px;
      letter-spacing: 0.38em; text-transform: uppercase; color: var(--ink-soft); padding-left: 0.38em;
    }
    .event { font-family: "Great Vibes", cursive; font-size: 96px; line-height: 0.78; color: var(--blush-deep); }
    .shower {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 22px;
      letter-spacing: 0.32em; text-transform: uppercase; color: var(--sky-deep); padding-left: 0.32em;
    }
    .celebrating { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 24px; color: var(--ink-soft); margin-top: 6px; }
    .baby-name {
      font-family: "Cinzel", serif; font-weight: 600; font-size: 26px;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); padding-left: 0.2em;
    }
    .panel {
      width: 100%; border-top: 1px solid var(--champagne); border-bottom: 1px solid var(--champagne);
      padding: 18px 4px 14px; display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 6px;
    }
    .label {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 12px;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-deep); padding-left: 0.3em;
    }
    .value { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 24px; color: var(--ink); margin-top: 4px; line-height: 1.15; }
    .sub { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 17px; color: var(--ink-soft); }
    .rsvp {
      font-family: "Cinzel", serif; font-size: 13px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--ink-soft); padding-left: 0.16em; margin-top: 12px;
    }
    .footer { font-family: "Great Vibes", cursive; font-size: 36px; color: var(--blush-deep); margin: 6px 0 8px; }
    .footer span { color: var(--sky-deep); }
  </style>
</head>
<body>
  <div class="sheet">
    <img class="wash" src="../assets/paper-wash.png" alt="" />
    <img class="flora left" src="../assets/botanical-left.png" alt="" />
    <img class="flora right" src="../assets/botanical-right.png" alt="" />
    <div class="frame"></div>
    <div class="copy">
      <div>
        <p class="kicker">A Sweet Surprise Awaits</p>
        <div class="rule"></div>
        <div class="he-she">
          <span class="he">He</span>
          <span class="or-col"><span class="diamond"></span><span class="or">or</span><span class="diamond"></span></span>
          <span class="she">She</span>
        </div>
      </div>
      <img class="balloons" src="../assets/balloons-hero.png" alt="" />
      <div>
        <p class="join">Join us for a</p>
        <p class="event">Gender Reveal</p>
        <p class="shower">Baby Shower</p>
        <p class="celebrating">celebrating</p>
        <p class="baby-name">The Walker Baby</p>
      </div>
      <div style="width:100%">
        <div class="panel">
          <div>
            <p class="label">Date</p>
            <p class="value">Sept 12</p>
            <p class="sub">Saturday</p>
          </div>
          <div>
            <p class="label">Time</p>
            <p class="value">2:00 pm</p>
            <p class="sub">afternoon</p>
          </div>
          <div>
            <p class="label">Place</p>
            <p class="value">Garden House</p>
            <p class="sub">Willow Lane</p>
          </div>
        </div>
        <p class="rsvp">Rsvp to Olivia · by Sept 5</p>
        <p class="footer">we can’t wait to <span>meet you</span></p>
      </div>
    </div>
  </div>
</body>
</html>
