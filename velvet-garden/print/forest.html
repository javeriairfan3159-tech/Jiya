<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Velvet Garden · Forest · Amara</title>
  <link rel="stylesheet" href="shared.css" />
  <script src="wait.js"></script>
</head>
<body class="forest">
  <article class="card">
    <img class="plate" src="../assets/forest-botanical-bg.png" alt="" />
    <div class="foil"></div>
    <div class="copy">
      <p class="kicker">An evening in honour of</p>
      <div class="rule"></div>
      <h1 class="name">Amara</h1>
      <p class="script">her birthday</p>
      <div class="date-block">
        <p class="dow">Saturday</p>
        <p class="day">24</p>
        <p class="month">August</p>
        <p class="time">seven o’clock in the evening</p>
      </div>
      <p class="place-kicker">The Conservatory</p>
      <p class="place">Villa Céleste</p>
      <p class="address">black-tie garden soirée</p>
      <p class="foot">Kindly reply</p>
    </div>
  </article>
</body>
</html>
