<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blush &amp; Sky — Favor Tag</title>
  <link rel="stylesheet" href="_tokens.css" />
  <script src="wait.js"></script>
  <style>
    html, body { width: 1200px; height: 1200px; overflow: hidden; background: transparent; }
    .sheet {
      width: 1200px; height: 1200px; position: relative; border-radius: 50%;
      overflow: hidden; background: var(--paper);
    }
    .wash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ring {
      position: absolute; inset: 36px; border-radius: 50%;
      border: 2px solid var(--gold); z-index: 4; pointer-events: none;
    }
    .ring::after {
      content: ""; position: absolute; inset: 12px; border-radius: 50%;
      border: 1px solid var(--champagne);
    }
    .copy {
      position: absolute; inset: 80px; z-index: 6;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .kicker {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 16px;
      letter-spacing: 0.36em; text-transform: uppercase; color: var(--gold-deep); padding-left: 0.36em;
    }
    .thanks { font-family: "Great Vibes", cursive; font-size: 92px; color: var(--blush-deep); line-height: 0.85; margin: 8px 0 4px; }
    .booties { width: 380px; height: 240px; object-fit: contain; margin: 6px 0; }
    .line {
      font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 28px; color: var(--ink-soft);
    }
    .name {
      font-family: "Cinzel", serif; font-weight: 500; font-size: 18px;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--sky-deep);
      padding-left: 0.24em; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <img class="wash" src="../assets/paper-wash.png" alt="" />
    <div class="ring"></div>
    <div class="copy">
      <p class="kicker">With love</p>
      <p class="thanks">Thank you</p>
      <img class="booties" src="../assets/booties.png" alt="" />
      <p class="line">for celebrating our little surprise</p>
      <p class="name">The Walker Baby</p>
    </div>
  </div>
</body>
</html>
