<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophie's 4th Birthday — Frozen Invites (5×7)</title>
  <style>
    :root {
      --ice: #7ec8e3;
      --deep: #0a1628;
      --aurora: #5dffb0;
      --frost: #e8f7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #1a3a5c 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #2a1a4a 0%, transparent 45%),
        var(--deep);
      color: var(--frost);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      max-width: 40rem;
      margin: 0 auto 2.5rem;
    }

    header h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(120deg, var(--ice), var(--aurora), #c9a0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      margin-top: 0.75rem;
      opacity: 0.85;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      text-align: center;
    }

    .card h2 {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ice);
      margin-bottom: 0.75rem;
    }

    .invite {
      width: 5in;
      height: 7in;
      max-width: 100%;
      object-fit: cover;
      display: block;
      margin: 0 auto;
      box-shadow:
        0 0 0 1px rgba(126, 200, 227, 0.25),
        0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .meta {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .actions {
      margin-top: 1rem;
    }

    .actions a {
      color: var(--aurora);
      text-decoration: none;
      font-size: 0.85rem;
      border-bottom: 1px solid transparent;
    }

    .actions a:hover {
      border-bottom-color: var(--aurora);
    }

    @media print {
      body {
        background: white;
        padding: 0;
        color: black;
      }

      header,
      .meta,
      .actions,
      .card h2 {
        display: none !important;
      }

      .grid {
        display: block;
      }

      .card {
        page-break-after: always;
        break-after: page;
      }

      .card:last-child {
        page-break-after: auto;
      }

      .invite {
        width: 5in;
        height: 7in;
        box-shadow: none;
        margin: 0;
      }

      @page {
        size: 5in 7in;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sophie's 4th Birthday Invites</h1>
    <p>
      Two original ice-wonderland designs at exact <strong>5×7 inches</strong> (300 DPI).
      Open this page and use Print — each invite prints on its own 5×7 page.
    </p>
  </header>

  <div class="grid">
    <figure class="card">
      <h2>Version A — Ice Castle Portal</h2>
      <img
        class="invite"
        src="sophie-frozen-birthday-invite-5x7-print-5x7.png"
        alt="Sophie's 4th Birthday ice castle portal invitation, 5 by 7 inches"
        width="1500"
        height="2100"
      />
      <figcaption class="meta">1500 × 2100 px · 5×7 in @ 300 DPI</figcaption>
      <p class="actions">
        <a href="sophie-frozen-birthday-invite-5x7-print-5x7.png" download>Download PNG</a>
      </p>
    </figure>

    <figure class="card">
      <h2>Version B — Cosmic Ice Galaxy (Crazy)</h2>
      <img
        class="invite"
        src="sophie-frozen-crazy-invite-5x7-print-5x7.png"
        alt="Sophie's 4th Birthday cosmic ice galaxy invitation, 5 by 7 inches"
        width="1500"
        height="2100"
      />
      <figcaption class="meta">1500 × 2100 px · 5×7 in @ 300 DPI</figcaption>
      <p class="actions">
        <a href="sophie-frozen-crazy-invite-5x7-print-5x7.png" download>Download PNG</a>
      </p>
    </figure>
  </div>
</body>
</html>
