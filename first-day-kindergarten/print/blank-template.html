<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>First Day of Kindergarten — Blank Fill-In Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#fff8f0; --ink:#2b2b2b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #e8e0d4; }
    .page {
      width: 8.5in; height: 11in; margin: 24px auto;
      background: var(--paper); color: var(--ink); position: relative; overflow: hidden;
      box-shadow: 0 18px 50px rgba(43,43,43,0.18);
    }
    .border { position:absolute; inset:0.28in; border:2px dashed #3a3a3a; border-radius:10px; pointer-events:none; }
    .inner { height:100%; padding:0.42in 0.48in 0.36in; display:flex; flex-direction:column; gap:0.14in; position:relative; }
    .bunting { display:flex; justify-content:center; gap:7px; height:0.38in; }
    .flag { width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:22px solid var(--c); }
    .kicker { text-align:center; font-family:"Nunito",sans-serif; font-weight:800; letter-spacing:0.28em; font-size:13px; }
    .headline { display:flex; justify-content:center; gap:3px; }
    .headline span { font-family:"Fredoka",sans-serif; font-weight:700; font-size:42px; line-height:1; }
    .headline span:nth-child(1){color:#e85d4c} .headline span:nth-child(2){color:#f4a261}
    .headline span:nth-child(3){color:#e9c46a} .headline span:nth-child(4){color:#43b97f}
    .headline span:nth-child(5){color:#4d96ff} .headline span:nth-child(6){color:#6c7cff}
    .headline span:nth-child(7){color:#7b68ee} .headline span:nth-child(8){color:#e07a9a}
    .headline span:nth-child(9){color:#2a9d8f} .headline span:nth-child(10){color:#f4a261}
    .headline span:nth-child(11){color:#4d96ff} .headline span:nth-child(12){color:#e85d4c}
    .name-field { text-align:center; }
    .name-field .label { font-family:"Caveat",cursive; font-size:18px; color:#7a736a; }
    .name-field .line { width:3.4in; margin:4px auto 0; border-bottom:2px dotted #c9c1b6; height:22px; }
    .ribbon { align-self:center; background:linear-gradient(#f3d36b,#e9c46a); font-family:"Nunito",sans-serif; font-weight:800; letter-spacing:0.12em; font-size:12px; padding:8px 28px; border-radius:4px; }
    .row { display:grid; gap:10px; }
    .row-3 { grid-template-columns:1fr 1fr 1fr; }
    .row-2 { grid-template-columns:1.05fr 0.95fr; flex:1; }
    .card { background:#fff; border:2px dashed var(--accent,#4d96ff); border-radius:14px; padding:9px 12px 12px; }
    .label { font-family:"Caveat",cursive; font-size:20px; font-weight:700; color:#5b5b5b; }
    .line { border-bottom:2px dotted #c9c1b6; height:22px; margin-top:8px; }
    .stack { display:flex; flex-direction:column; gap:10px; }
    .fav .item { display:grid; grid-template-columns:18px 62px 1fr; align-items:end; gap:6px; margin-top:8px; font-family:"Nunito",sans-serif; font-size:13px; font-weight:800; }
    .banner { margin-top:auto; background:#f4c4d2; border-radius:12px; text-align:center; font-family:"Nunito",sans-serif; font-weight:800; letter-spacing:0.08em; padding:11px 12px; font-size:15px; }
    .footer { text-align:center; font-family:"Nunito",sans-serif; font-size:10px; letter-spacing:0.22em; font-weight:800; color:#8a8178; }
    .doodle { position:absolute; font-size:22px; }
    .pencil { top:0.72in; left:0.42in; } .apple { top:0.72in; right:0.46in; }
    .books { bottom:0.92in; left:0.42in; } .pack { bottom:0.92in; right:0.46in; }
    @media print {
      html, body { background:white; }
      .page { margin:0; box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      @page { size: letter portrait; margin: 0; }
    }
  </style>
</head>
<body>
  <article class="page">
    <div class="border"></div>
    <div class="doodle pencil">✏️</div>
    <div class="doodle apple">🍎</div>
    <div class="doodle books">📚</div>
    <div class="doodle pack">🎒</div>
    <div class="inner">
      <div class="bunting">
        <div class="flag" style="--c:#e85d4c"></div>
        <div class="flag" style="--c:#f4a261"></div>
        <div class="flag" style="--c:#e9c46a"></div>
        <div class="flag" style="--c:#43b97f"></div>
        <div class="flag" style="--c:#4d96ff"></div>
        <div class="flag" style="--c:#7b68ee"></div>
        <div class="flag" style="--c:#e07a9a"></div>
      </div>
      <div class="kicker">FIRST DAY OF</div>
      <div class="headline"><span>K</span><span>I</span><span>N</span><span>D</span><span>E</span><span>R</span><span>G</span><span>A</span><span>R</span><span>T</span><span>E</span><span>N</span></div>
      <div class="name-field"><div class="label">♥ my name ♥</div><div class="line"></div></div>
      <div class="ribbon">LET THE ADVENTURE BEGIN!</div>
      <div class="row row-3">
        <div class="card" style="--accent:#e85d4c"><div class="label">Today is:</div><div class="line"></div></div>
        <div class="card" style="--accent:#e9c46a"><div class="label">I am:</div><div class="line"></div><div class="label" style="font-size:16px">years old</div></div>
        <div class="card" style="--accent:#2a9d8f"><div class="label">My school:</div><div class="line"></div></div>
      </div>
      <div class="row row-2">
        <div class="stack">
          <div class="card" style="--accent:#7b68ee"><div class="label">My teacher is:</div><div class="line"></div></div>
          <div class="card" style="--accent:#e07a9a"><div class="label">I love:</div><div class="line"></div><div class="line"></div></div>
          <div class="card" style="--accent:#4d96ff"><div class="label">When I grow up I want to be:</div><div class="line"></div></div>
        </div>
        <div class="card fav" style="--accent:#2a9d8f">
          <div class="label">My favorite things</div>
          <div class="item"><span>🍕</span><span>Food</span><span class="line"></span></div>
          <div class="item"><span>🎨</span><span>Color</span><span class="line"></span></div>
          <div class="item"><span>📖</span><span>Book</span><span class="line"></span></div>
          <div class="item"><span>⚽</span><span>Activity</span><span class="line"></span></div>
          <div class="item"><span>⭐</span><span>Friend</span><span class="line"></span></div>
        </div>
      </div>
      <div class="banner">♥  I AM SO EXCITED FOR THIS YEAR!  ♥</div>
      <div class="footer">A MEMORY TO KEEP FOREVER</div>
    </div>
  </article>
</body>
</html>
