<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Velvet Garden · Ivory Blank Template</title>
  <link rel="stylesheet" href="shared.css" />
  <script src="wait.js"></script>
</head>
<body class="ivory">
  <article class="card">
    <img class="plate" src="../assets/ivory-right-cascade-bg.png" alt="" />
    <div class="foil"></div>
    <div class="copy">
      <p class="kicker">An evening in honour of</p>
      <div class="rule"></div>
      <div class="blank-name"></div>
      <p class="script">a birthday</p>
      <div class="date-block">
        <p class="hint">Day</p>
        <div class="blank-line" style="width:1.7in"></div>
        <p class="hint">Date</p>
        <div class="blank-line" style="width:1.35in;height:0.48in"></div>
        <p class="hint">Month</p>
        <div class="blank-line" style="width:1.7in"></div>
        <p class="hint">Time</p>
        <div class="blank-line"></div>
      </div>
      <p class="place-kicker">Venue</p>
      <div class="blank-line"></div>
      <div class="blank-line" style="width:1.9in"></div>
      <p class="foot">Kindly reply</p>
    </div>
  </article>
</body>
</html>
