<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moo Moos & Margaritas — Favor Tag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@500&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 1200px; overflow: hidden; background: transparent; }
    .tag {
      width: 1200px; height: 1200px; border-radius: 50%;
      background-color: #fffdf8;
      background-image: url("../assets/cow-classic.svg");
      background-size: 120px 94px;
      display: flex; align-items: center; justify-content: center;
    }
    .inner {
      width: 980px; height: 980px; border-radius: 50%; background: #fff8f0;
      box-shadow: inset 0 0 0 2px #e23d86;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 80px;
    }
    .kicker { font-family: "Cinzel", serif; font-weight: 700; letter-spacing: .32em; font-size: 22px; color: #b81d5a; text-transform: uppercase; }
    .flourish { width: 280px; height: 56px; object-fit: contain; margin: 10px 0; }
    h1 { font-family: "Pinyon Script", cursive; font-size: 96px; color: #e23d86; line-height: .85; margin: 4px 0 16px; }
    p { font-family: "Outfit", sans-serif; font-weight: 500; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #1c1410; }
  </style>
</head>
<body>
  <div class="tag">
    <div class="inner">
      <p class="kicker">Thanks for</p>
      <img class="flourish" src="../assets/flourish.png" alt="" />
      <h1>moo-ving it</h1>
      <p>Isabella’s 30th</p>
    </div>
  </div>
</body>
</html>
