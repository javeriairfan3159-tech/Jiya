<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charlie — Two Infinity · Variation B · 5×7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #1a4fc4;
      --sky-deep: #0d2d7a;
      --banner-red: #e03131;
      --logo-yellow: #ffe14a;
      --hat: #6b3fa0;
      --paper: #fffef9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 5in; height: 7in; overflow: hidden; background: var(--paper);
      font-family: "Fredoka", system-ui, sans-serif; color: var(--sky-deep);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    @page { size: 5in 7in; margin: 0; }

    .sheet {
      width: 5in; height: 7in; position: relative; overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, #fff3c4 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, #dce9ff 0%, transparent 35%),
        radial-gradient(circle at 100% 80%, #ffe4f0 0%, transparent 30%),
        var(--paper);
      border: 4px solid var(--sky);
    }

    .stars {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background-image:
        radial-gradient(circle, #ffe14a 1.2px, transparent 1.3px),
        radial-gradient(circle, #ff6b9d 1px, transparent 1.1px),
        radial-gradient(circle, #3ec6ff 1.1px, transparent 1.2px),
        radial-gradient(circle, #3ecf8e 1px, transparent 1.1px);
      background-size: 48px 52px, 62px 58px, 54px 64px, 70px 50px;
      background-position: 8px 10px, 24px 30px, 40px 18px, 12px 44px;
      opacity: 0.7;
    }

    .content {
      position: relative; z-index: 3;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 0.42in 0.55in 0;
      height: 4.85in;
    }

    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      color: var(--sky); text-transform: uppercase; margin-bottom: 8px;
    }

    .banner {
      background: var(--banner-red); color: var(--logo-yellow);
      font-family: "Luckiest Guy", cursive; font-size: 32px; line-height: 1;
      padding: 12px 24px 10px; border: 3px solid var(--sky);
      transform: rotate(-1.5deg);
      box-shadow: 0 6px 0 rgba(13,45,122,.25);
      text-shadow: -2px -2px 0 #1240a8, 2px -2px 0 #1240a8, -2px 2px 0 #1240a8, 2px 2px 0 #1240a8;
    }

    .beyond { font-family: "Pacifico", cursive; font-size: 28px; margin-top: 10px; color: var(--sky-deep); }
    .name { font-family: "Pacifico", cursive; font-size: 54px; color: var(--sky); line-height: 1; margin-top: 6px; }

    .age-block {
      margin-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 0;
    }
    .age-block .label { font-size: 16px; font-weight: 700; color: var(--sky); }
    .age {
      font-family: "Luckiest Guy", cursive; font-size: 78px; color: var(--logo-yellow); line-height: 0.85;
      text-shadow: -3px -3px 0 #1240a8, 3px -3px 0 #1240a8, -3px 3px 0 #1240a8, 3px 3px 0 #1240a8;
    }

    .join { margin-top: 8px; font-size: 15px; font-weight: 700; color: var(--sky-deep); }

    .when {
      margin-top: 12px; background: var(--banner-red); border: 2.5px dashed #fff;
      border-radius: 16px; padding: 10px 28px; color: #fff;
      box-shadow: 0 0 0 7px var(--sky);
    }
    .when .date { font-family: "Luckiest Guy", cursive; font-size: 28px; color: var(--logo-yellow); }
    .when .time { font-size: 15px; font-weight: 600; }

    .address { margin-top: 12px; font-size: 12px; color: var(--sky); line-height: 1.35; }
    .rsvp { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--sky-deep); }

    .parade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2in;
      z-index: 2; display: flex; align-items: flex-end; justify-content: center;
      gap: 2px; padding: 0 6px 8px;
      background: linear-gradient(to top, rgba(26,79,196,.08), transparent 70%);
    }
    .parade svg {
      width: 46px; height: auto;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,.12));
    }
    .parade svg.big { width: 54px; }
    .parade svg.wide { width: 58px; }
  </style>
</head>
<body>
  <article class="sheet">
    <div class="stars" aria-hidden="true"></div>
    <div class="content">
      <div class="eyebrow">Toy Adventure Party</div>
      <div class="banner">TWO INFINITY</div>
      <div class="beyond">And Beyond!</div>
      <div class="name">Charlie</div>
      <div class="age-block">
        <span class="label">is Turning</span>
        <span class="age">3</span>
      </div>
      <div class="join">Join us as we Celebrate</div>
      <div class="when">
        <div class="date">June 25</div>
        <div class="time">3 PM – 5 PM</div>
      </div>
      <p class="address">Suite 864 / 113 Emilio Plaza<br />North Jed, KS 68416-3036</p>
      <p class="rsvp">RSVP TO MOM: 555 222 1111</p>
    </div>

    <div class="parade" aria-hidden="true">

      <svg class="wide" viewBox="0 0 70 60"><ellipse cx="14" cy="28" rx="11" ry="10" fill="#c45c26"/><path d="M24 30c6-8 12 6 18-2s10 8 16 0" stroke="#e0a820" stroke-width="4" fill="none"/><ellipse cx="58" cy="34" rx="8" ry="7" fill="#c45c26"/><path d="M9 14l5-8 5 8" fill="#6b3fa0"/><circle cx="14" cy="7" r="2.5" fill="#ffe14a"/></svg>
      <svg viewBox="0 0 55 80"><ellipse cx="28" cy="48" rx="16" ry="20" fill="#4ad687"/><ellipse cx="28" cy="24" rx="12" ry="11" fill="#4ad687"/><path d="M22 10l6-8 6 8" fill="#6b3fa0"/><circle cx="28" cy="4" r="2.8" fill="#ffe14a"/><circle cx="23" cy="22" r="1.8" fill="#222"/><circle cx="33" cy="22" r="1.8" fill="#222"/></svg>

      <svg viewBox="0 0 55 75"><ellipse cx="28" cy="42" rx="18" ry="16" fill="#ff8fab"/><ellipse cx="42" cy="40" rx="5" ry="4" fill="#ff8fab"/><circle cx="22" cy="36" r="1.8" fill="#222"/><circle cx="32" cy="36" r="1.8" fill="#222"/><path d="M22 18l6-10 6 10" fill="#6b3fa0"/><circle cx="28" cy="10" r="2.8" fill="#ffe14a"/><circle cx="44" cy="14" r="8" fill="#3ecf8e"/><line x1="44" y1="22" x2="40" y2="34" stroke="#2fae5f" stroke-width="1.5"/></svg>
      <svg viewBox="0 0 55 80"><ellipse cx="28" cy="42" rx="16" ry="20" fill="#5ad687"/><circle cx="20" cy="34" r="3" fill="#fff"/><circle cx="28" cy="30" r="3" fill="#fff"/><circle cx="36" cy="34" r="3" fill="#fff"/><circle cx="20" cy="34" r="1.3" fill="#222"/><circle cx="28" cy="30" r="1.3" fill="#222"/><circle cx="36" cy="34" r="1.3" fill="#222"/><path d="M22 14l6-9 6 9" fill="#6b3fa0"/><circle cx="28" cy="7" r="2.8" fill="#ffe14a"/><rect x="18" y="55" width="18" height="12" rx="1" fill="#1a4fc4"/><path d="M18 59h18" stroke="#ffe14a" stroke-width="2"/></svg>
      <svg viewBox="0 0 55 80"><ellipse cx="28" cy="42" rx="17" ry="20" fill="#c9a06a"/><circle cx="22" cy="38" r="3" fill="#fff"/><circle cx="34" cy="38" r="3" fill="#fff"/><circle cx="22" cy="38" r="1.4" fill="#222"/><circle cx="34" cy="38" r="1.4" fill="#222"/><ellipse cx="28" cy="46" rx="4" ry="2.5" fill="#8b4513"/><path d="M22 16l6-10 6 10" fill="#6b3fa0"/><circle cx="28" cy="8" r="2.8" fill="#ffe14a"/></svg>
      <svg class="wide" viewBox="0 0 75 55"><ellipse cx="36" cy="32" rx="20" ry="12" fill="#c45c26"/><ellipse cx="58" cy="26" rx="10" ry="9" fill="#c45c26"/><circle cx="62" cy="23" r="1.6" fill="#222"/><path d="M52 12l5-8 5 8" fill="#6b3fa0"/><circle cx="57" cy="6" r="2.5" fill="#ffe14a"/><circle cx="30" cy="28" r="4" fill="#fff"/><circle cx="30" cy="28" r="2" fill="#e03131"/><path d="M20 40v10M32 42v10M44 40v10" stroke="#6b3a1f" stroke-width="3.5" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 55 80"><circle cx="28" cy="28" r="11" fill="#f0c98a"/><path d="M18 24c4-14 16-14 20 0" fill="#e85d2a"/><path d="M22 12l6-9 6 9" fill="#6b3fa0"/><circle cx="28" cy="5" r="3" fill="#ffe14a"/><rect x="18" y="40" width="20" height="26" fill="#e03131"/><rect x="18" y="40" width="20" height="10" fill="#fff"/><circle cx="24" cy="27" r="1.5" fill="#222"/><circle cx="32" cy="27" r="1.5" fill="#222"/></svg>
    </div>
  </article>
</body>
</html>
