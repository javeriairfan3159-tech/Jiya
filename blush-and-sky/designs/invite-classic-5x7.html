<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gender Reveal Baby Shower — Classic 5×7</title>
  <link rel="stylesheet" href="_tokens.css" />
  <script src="wait.js"></script>
  <style>
    html, body { width: 1500px; height: 2100px; overflow: hidden; background: #fff; }
    .sheet {
      width: 1500px; height: 2100px; position: relative;
      background: #fff;
    }
    .wash {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .dot {
      position: absolute; border-radius: 50%; z-index: 3; pointer-events: none;
    }
    .star {
      position: absolute; z-index: 3; pointer-events: none;
      width: 22px; height: 22px;
      background: url("../assets/gold-glitter.png") center / cover;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .heart {
      position: absolute; z-index: 3; pointer-events: none;
      width: 18px; height: 16px;
    }
    .copy {
      position: absolute; inset: 36px 64px 48px;
      z-index: 6;
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between;
      text-align: center;
    }
    .block { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .curve {
      width: 1240px; height: 132px; margin-top: 4px;
    }
    .curve text {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-size: 44px;
      letter-spacing: 7px;
      fill: #4a4542;
    }
    .hero {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%; margin-top: 0;
      height: 480px;
    }
    .print {
      width: 340px; height: 470px;
      object-fit: contain;
    }
    .he-she {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-width: 280px;
      margin-top: -20px;
    }
    .he, .she {
      font-family: "Great Vibes", cursive;
      font-size: 128px;
      line-height: 0.78;
    }
    .he { color: #5aa3d0; }
    .she { color: #e57aa0; }
    .or-wrap {
      position: relative;
      height: 70px; width: 150px;
      display: flex; align-items: center; justify-content: center;
      margin: -6px 0 2px;
    }
    .or {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 0.04em;
      background-image: url("../assets/gold-glitter.png");
      background-size: 220px;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 0 #c4a15a);
      position: relative; z-index: 1;
    }
    .whiskers {
      position: absolute; inset: 0; width: 150px; height: 70px;
    }
    .ribbon-wrap {
      position: relative;
      width: 1360px; height: 230px;
      margin: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ribbon {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .ribbon-text {
      position: relative; z-index: 2;
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding-left: 0.22em;
      background-image: url("../assets/gold-glitter.png");
      background-size: 280px;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 0 rgba(140,100,40,0.45));
      margin-top: -6px;
    }
    .ribbon-text strong {
      font-weight: 700;
      letter-spacing: 0.28em;
    }
    .join {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #5a5550;
      padding-left: 0.34em;
      margin-top: 0;
    }
    .event {
      font-family: "Great Vibes", cursive;
      font-size: 136px;
      line-height: 0.78;
      color: #e57aa0;
      margin-top: 6px;
    }
    .shower {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-size: 32px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #5aa3d0;
      padding-left: 0.42em;
      margin-top: 6px;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      width: 100%;
      margin-top: 8px;
      align-items: start;
      gap: 10px;
    }
    .col { text-align: center; padding: 0 12px; }
    .col img {
      width: 78px; height: 78px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }
    .d1 {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a4542;
      line-height: 1.25;
    }
    .d2 {
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-size: 20px;
      color: #5a5550;
      line-height: 1.3;
      margin-top: 4px;
    }
    .foot {
      margin-top: 8px;
      margin-bottom: 6px;
      display: flex; align-items: baseline; justify-content: center; gap: 12px;
    }
    .foot .script {
      font-family: "Great Vibes", cursive;
      font-size: 42px;
      color: #6b6560;
    }
    .foot .wait {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.18em;
      background-image: url("../assets/gold-glitter.png");
      background-size: 180px;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .foot .you {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.12em;
      color: #e57aa0;
    }
    .foot .bang {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 28px;
      color: #5aa3d0;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <img class="wash" src="../assets/classic-paper-wash.png" alt="" />

    <span class="dot" style="width:14px;height:14px;background:#f4b3c8;top:310px;left:92px;opacity:.85"></span>
    <span class="dot" style="width:10px;height:10px;background:#8ec4e4;top:280px;right:110px;opacity:.9"></span>
    <span class="dot" style="width:12px;height:12px;background:#f4b3c8;bottom:430px;left:70px;opacity:.8"></span>
    <span class="dot" style="width:11px;height:11px;background:#8ec4e4;bottom:390px;right:86px;opacity:.85"></span>
    <span class="star" style="top:240px;left:130px;width:18px;height:18px"></span>
    <span class="star" style="top:255px;right:148px;width:16px;height:16px"></span>
    <span class="star" style="bottom:520px;left:118px;width:20px;height:20px"></span>
    <span class="star" style="bottom:500px;right:130px;width:17px;height:17px"></span>
    <span class="star" style="top:980px;left:58px;width:14px;height:14px"></span>
    <span class="star" style="top:1020px;right:62px;width:15px;height:15px"></span>

    <div class="copy">
      <div class="block">
      <svg class="curve" viewBox="0 0 1180 150" aria-hidden="true">
        <path id="arc" d="M 70 128 Q 590 8 1110 128" fill="none" />
        <text>
          <textPath href="#arc" startOffset="50%" text-anchor="middle">WHAT WILL BABY BE?</textPath>
        </text>
      </svg>

      <div class="hero">
        <img class="print" src="../assets/footprint-pink.png" alt="" />
        <div class="he-she">
          <span class="he">He</span>
          <div class="or-wrap">
            <svg class="whiskers" viewBox="0 0 150 70" aria-hidden="true">
              <g stroke="#c4a15a" stroke-width="1.6" fill="none" stroke-linecap="round">
                <path d="M18 22 Q 40 28 55 32" />
                <path d="M16 35 Q 38 35 55 35" />
                <path d="M18 48 Q 40 42 55 38" />
                <path d="M132 22 Q 110 28 95 32" />
                <path d="M134 35 Q 112 35 95 35" />
                <path d="M132 48 Q 110 42 95 38" />
              </g>
            </svg>
            <span class="or">or</span>
          </div>
          <span class="she">She</span>
        </div>
        <img class="print" src="../assets/footprint-blue.png" alt="" />
      </div>
      </div>

      <div class="ribbon-wrap">
        <img class="ribbon" src="../assets/ribbon-banner.png" alt="" />
        <p class="ribbon-text">WHAT WILL <strong>BABY</strong> BE?</p>
      </div>

      <div class="block">
      <p class="join">Join us for a</p>
      <p class="event">Gender Reveal</p>
      <p class="shower">· Baby Shower ·</p>
      </div>

      <div class="details">
        <div class="col">
          <img src="../assets/icon-calendar.png" alt="" />
          <p class="d1">Saturday</p>
          <p class="d1">June 14, 2025</p>
          <p class="d2">2:00 PM</p>
        </div>
        <div class="col">
          <img src="../assets/icon-pin.png" alt="" />
          <p class="d1">The Smith Home</p>
          <p class="d2">123 Baby Lane</p>
          <p class="d2">Loveville, CA 12345</p>
        </div>
        <div class="col">
          <img src="../assets/icon-rsvp.png" alt="" />
          <p class="d1">RSVP to Emily</p>
          <p class="d2">123-456-7890</p>
          <p class="d2">by June 7th</p>
        </div>
      </div>

      <p class="foot">
        <span class="script">We will</span>
        <span class="wait">WAIT</span>
        <span class="script">for</span>
        <span class="you">YOU</span><span class="bang">!</span>
      </p>
    </div>
  </div>
</body>
</html>
